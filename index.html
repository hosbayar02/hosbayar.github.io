<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>21b1num1817_itulab</title>
	<style>
		* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    min-height: 100vh;
    display: flex;
    flex-direction: column; 
    justify-content: center;
    align-items: center;
    background: linear-gradient(-45deg, #667eea, #764ba2, #6b8dd6, #8e37d7);
    background-size: 400% 400%;
    animation: bg 10s ease infinite;
    color: white;
}
@keyframes bg {
    0% {background-position: 0% 50%;}
    50% {background-position: 100% 50%;}
    100% {background-position: 0% 50%;}
}
.container {
    width: 80%;
    max-width: 700px;
    text-align: center;
    padding: 40px;
    background: rgba(255,255,255,0.15);
    backdrop-filter: blur(10px);
    border-radius: 20px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.3);
}
.card {
    margin-top: 15px;
    padding: 15px;
    background: rgba(255,255,255,0.2);
    border-radius: 12px;
    transition: 0.3s;
    cursor: pointer;
}

.card:hover {
    transform: translateY(-8px);
    background: rgba(255,255,255,0.3);
}
button {
    margin-top: 20px;
    padding: 10px 20px;
    border: none;
    border-radius: 10px;
    background: white;
    color: black;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    transform: scale(1.1);
    background: black;
    color: white;
}
a {
    text-decoration: none;
    color: white;
    transition: 0.3s;
}

a:hover {
    color: yellow;
    transform: scale(1.05);
}
	</style>
</head>
<body>
	<h1>Hello this is my first internet technology laboratory</h1>
		<ul>
	<li><a href="lab1/">Laboratory 1</a></li>
	<li><a href="lab2/">Laboratory 2</a></li>
		</ul>
</body>
</html>
